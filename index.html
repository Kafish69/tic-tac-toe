<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="tic tac toe">
  <meta name="description" content="Tic tac toe for two — online, one code, five modes.">
  <meta property="og:title" content="tic · tac · toe — you're invited">
  <meta property="og:description" content="Tap the link and play with me.">
  <title>tic tac toe</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="app">
    <!-- HOME -->
    <section id="home" class="screen">
      <header class="brand">
        <h1 class="logo">tic tac toe</h1>
        <p class="tagline">for two.</p>
      </header>

      <div class="card">
        <label class="field">
          <span>Your name</span>
          <input id="nameInput" maxlength="16" autocomplete="nickname" placeholder="e.g. Kafish" enterkeyhint="done">
        </label>

        <button id="createBtn" class="btn primary">Create a room</button>

        <div class="join-row">
          <input id="codeInput" class="code-input" maxlength="6" placeholder="CODE" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Room code">
          <button id="joinBtn" class="btn">Join</button>
        </div>

        <div class="divider"><span>or</span></div>
        <button id="localBtn" class="btn ghost">Play on one phone</button>
      </div>

      <footer class="foot">by Kafish</footer>
    </section>

    <!-- GAME -->
    <section id="game" class="screen hidden">
      <div class="topbar">
        <button id="backBtn" class="icon-btn" aria-label="Leave">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button id="roomChip" class="room-chip" aria-label="Share room">
          <span id="netDot" class="net-dot"></span>
          <span id="roomCode" class="room-code">—</span>
          <span class="share-label">Share</span>
        </button>
        <div class="top-right">
          <button id="chatBtn" class="icon-btn chat-btn" aria-label="Chat">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-11.6 7.1L4 20l1-4.1A8 8 0 1120 12z"/></svg>
            <span id="chatBadge" class="badge hidden">0</span>
          </button>
          <button id="soundBtn" class="icon-btn" aria-label="Sound"></button>
        </div>
      </div>

      <div class="players">
        <div class="player" id="pX">
          <svg class="pmark x" viewBox="0 0 100 100"><path d="M28 28 L72 72"/><path d="M72 28 L28 72"/></svg>
          <div class="pinfo"><div class="pname"></div><div class="pstatus"></div></div>
          <div class="pscore">0</div>
        </div>
        <div class="draws"><b id="drawCount">0</b><small>draws</small></div>
        <div class="player" id="pO">
          <svg class="pmark o" viewBox="0 0 100 100"><circle cx="50" cy="50" r="24"/></svg>
          <div class="pinfo"><div class="pname"></div><div class="pstatus"></div></div>
          <div class="pscore">0</div>
        </div>
      </div>

      <div id="status" class="status" aria-live="polite"></div>

      <div id="boardWrap" class="board-wrap">
        <div id="board" class="board"></div>
        <div id="invite" class="invite hidden">
          <p class="invite-k">waiting for player 2</p>
          <div id="inviteCode" class="invite-code">——————</div>
          <button id="inviteShare" class="btn primary">Send the invite</button>
          <p class="invite-s">they open the link (or type the code) and you're live.</p>
        </div>
        <div id="connecting" class="invite hidden">
          <div class="spinner"></div>
          <p class="invite-k" id="connectingText">connecting…</p>
        </div>
      </div>

      <div class="actions">
        <button id="rematchBtn" class="btn primary hidden">Play again</button>
      </div>

      <div class="modes" id="modes" role="tablist"></div>
      <p id="modeDesc" class="mode-desc"></p>

      <div class="reactions" id="reactions"></div>
    </section>
  </main>

  <!-- CHAT -->
  <aside id="chat" class="sheet hidden" aria-label="Chat">
    <div class="sheet-head">
      <div class="sheet-title"><b id="chatTitle">Chat</b><small id="typing"></small></div>
      <button id="chatClose" class="icon-btn" aria-label="Close chat">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="msgs" class="msgs"><p class="empty">Say something nice.</p></div>
    <div id="gifPanel" class="gif-panel hidden">
      <div class="gif-top">
        <input id="gifQuery" class="gif-query" placeholder="Search GIFs" autocomplete="off" enterkeyhint="search">
      </div>
      <div id="gifGrid" class="gif-grid"></div>
      <p id="gifNote" class="gif-note"></p>
    </div>
    <form id="composer" class="composer" autocomplete="off">
      <button type="button" id="gifBtn" class="gif-btn" aria-label="GIFs">GIF</button>
      <input id="msgInput" class="msg-input" placeholder="Message" maxlength="500" enterkeyhint="send">
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
  </aside>

  <div id="floaters" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="toast" role="status"></div>

  <script src="vendor/mqtt.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
